name: Build Nomad Animator (ImGui)
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Create project + download ImGui
        run: |
          set -e
          rm -f settings.gradle build.gradle
          rm -rf src .gradle

          mkdir -p src/main/cpp src/main/java/com/nomad/animator

          # Gradle
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' }
          android {
              namespace 'com.nomad.animator'
              compileSdk 34
              ndkVersion '25.1.8937393'
              defaultConfig {
                  applicationId 'com.nomad.animator'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
              }
              externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
              buildTypes { release { minifyEnabled false } }
          }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "NomadAnimator"
          EOF

          # Manifest
          cat > src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
            <application android:label="Nomad Animator" android:hasCode="true">
              <activity android:name="android.app.NativeActivity"
                  android:exported="true"
                  android:screenOrientation="landscape"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:configChanges="orientation|keyboardHidden|screenSize">
                <meta-data android:name="android.app.lib_name" android:value="nomad"/>
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # CMake
          cat > src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(nomad)
          set(CMAKE_CXX_STANDARD 17)
          add_library(nomad SHARED
            main.cpp
            imgui/imgui.cpp
            imgui/imgui_draw.cpp
            imgui/imgui_tables.cpp
            imgui/imgui_widgets.cpp
            imgui/backends/imgui_impl_opengl3.cpp
            android_native_app_glue.c
          )
          target_include_directories(nomad PRIVATE
            ${CMAKE_CURRENT_SOURCE_DIR}
            ${CMAKE_CURRENT_SOURCE_DIR}/imgui
            ${CMAKE_CURRENT_SOURCE_DIR}/imgui/backends
            ${ANDROID_NDK}/sources/android/native_app_glue
          )
          target_compile_definitions(nomad PRIVATE IMGUI_IMPL_OPENGL_ES3)
          find_library(log-lib log)
          find_library(android-lib android)
          find_library(EGL-lib EGL)
          find_library(GLESv3-lib GLESv3)
          target_link_libraries(nomad ${log-lib} ${android-lib} ${EGL-lib} ${GLESv3-lib})
          EOF

          # native_app_glue
          cp $ANDROID_NDK/sources/android/native_app_glue/android_native_app_glue.c src/main/cpp/ 2>/dev/null || \
          cp /usr/local/lib/android/sdk/ndk/*/sources/android/native_app_glue/android_native_app_glue.c src/main/cpp/ 2>/dev/null || true

          # Download Dear ImGui
          git clone --depth 1 https://github.com/ocornut/imgui.git src/main/cpp/imgui

          # Main app with ImGui toolbar
          cat > src/main/cpp/main.cpp << 'EOF'
          #include <android_native_app_glue.h>
          #include <android/log.h>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <cmath>
          #include <vector>
          #include <string>

          #include "imgui.h"
          #include "backends/imgui_impl_opengl3.h"

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "Nomad", __VA_ARGS__)

          static android_app* g_app = nullptr;
          static EGLDisplay g_display = EGL_NO_DISPLAY;
          static EGLSurface g_surface = EGL_NO_SURFACE;
          static EGLContext g_context = EGL_NO_CONTEXT;
          static int g_width = 0, g_height = 0;
          static bool g_imgui_init = false;

          // App state
          static int g_tool = 0; // 0=move 1=rotate 2=select
          static float g_yaw = 0.6f, g_pitch = 0.4f, g_dist = 8.f;
          static float g_target[3] = {0, 0.5f, 0};

          struct Cube { float pos[3]; float color[3]; };
          static std::vector<Cube> g_cubes;
          static std::vector<std::vector<Cube>> g_undo, g_redo;

          static bool initEGL(ANativeWindow* window) {
            g_display = eglGetDisplay(EGL_DEFAULT_DISPLAY);
            eglInitialize(g_display, nullptr, nullptr);
            const EGLint attribs[] = {
              EGL_SURFACE_TYPE, EGL_WINDOW_BIT,
              EGL_RENDERABLE_TYPE, EGL_OPENGL_ES3_BIT,
              EGL_BLUE_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_RED_SIZE, 8,
              EGL_DEPTH_SIZE, 24, EGL_NONE
            };
            EGLConfig config; EGLint num;
            eglChooseConfig(g_display, attribs, &config, 1, &num);
            EGLint ctxAttribs[] = { EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE };
            g_context = eglCreateContext(g_display, config, nullptr, ctxAttribs);
            g_surface = eglCreateWindowSurface(g_display, config, window, nullptr);
            eglMakeCurrent(g_display, g_surface, g_surface, g_context);
            eglQuerySurface(g_display, g_surface, EGL_WIDTH, &g_width);
            eglQuerySurface(g_display, g_surface, EGL_HEIGHT, &g_height);
            return true;
          }

          static void termEGL() {
            if (g_display != EGL_NO_DISPLAY) {
              eglMakeCurrent(g_display, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
              if (g_context != EGL_NO_CONTEXT) eglDestroyContext(g_display, g_context);
              if (g_surface != EGL_NO_SURFACE) eglDestroySurface(g_display, g_surface);
              eglTerminate(g_display);
            }
            g_display = EGL_NO_DISPLAY; g_context = EGL_NO_CONTEXT; g_surface = EGL_NO_SURFACE;
          }

          static void initImGui() {
            IMGUI_CHECKVERSION();
            ImGui::CreateContext();
            ImGuiIO& io = ImGui::GetIO();
            io.IniFilename = nullptr;
            io.ConfigFlags |= ImGuiConfigFlags_NavEnableKeyboard;
            ImGui::StyleColorsDark();
            ImGuiStyle& style = ImGui::GetStyle();
            style.WindowRounding = 8.f;
            style.FrameRounding = 6.f;
            style.Colors[ImGuiCol_WindowBg] = ImVec4(0.12f, 0.12f, 0.14f, 0.95f);
            style.Colors[ImGuiCol_Button] = ImVec4(0.18f, 0.18f, 0.20f, 1.f);
            style.Colors[ImGuiCol_ButtonHovered] = ImVec4(0.28f, 0.28f, 0.32f, 1.f);
            style.Colors[ImGuiCol_ButtonActive] = ImVec4(0.24f, 0.35f, 0.50f, 1.f);
            ImGui_ImplOpenGL3_Init("#version 300 es");
            g_imgui_init = true;
          }

          static void addCube() {
            g_undo.push_back(g_cubes); g_redo.clear();
            Cube c;
            c.pos[0] = (g_cubes.size() % 4) * 1.5f - 2.f;
            c.pos[1] = 0.5f; c.pos[2] = 0.f;
            float cols[][3] = {{0.9f,0.35f,0.3f},{0.3f,0.7f,0.9f},{0.5f,0.85f,0.4f},{0.95f,0.8f,0.3f},{0.7f,0.45f,0.9f}};
            int i = g_cubes.size() % 5;
            c.color[0]=cols[i][0]; c.color[1]=cols[i][1]; c.color[2]=cols[i][2];
            g_cubes.push_back(c);
          }

          static void undo() {
            if (g_undo.empty()) return;
            g_redo.push_back(g_cubes);
            g_cubes = g_undo.back(); g_undo.pop_back();
          }
          static void redo() {
            if (g_redo.empty()) return;
            g_undo.push_back(g_cubes);
            g_cubes = g_redo.back(); g_redo.pop_back();
          }

          static void drawToolbar() {
            ImGuiIO& io = ImGui::GetIO();
            const float barH = 52.f;
            ImGui::SetNextWindowPos(ImVec2(0, 0));
            ImGui::SetNextWindowSize(ImVec2(io.DisplaySize.x, barH));
            ImGui::PushStyleVar(ImGuiStyleVar_WindowPadding, ImVec2(8, 8));
            ImGui::PushStyleVar(ImGuiStyleVar_WindowBorderSize, 0);
            ImGui::Begin("##toolbar", nullptr,
              ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize |
              ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoScrollbar);

            // Left tools
            if (ImGui::Button(g_tool==0 ? "[Move]" : "Move", ImVec2(64, 34))) g_tool = 0;
            ImGui::SameLine();
            if (ImGui::Button(g_tool==1 ? "[Rotate]" : "Rotate", ImVec2(64, 34))) g_tool = 1;
            ImGui::SameLine();
            if (ImGui::Button(g_tool==2 ? "[Select]" : "Select", ImVec2(64, 34))) g_tool = 2;
            ImGui::SameLine();
            if (ImGui::Button("+ Cube", ImVec2(64, 34))) addCube();

            // Right actions
            float rightX = io.DisplaySize.x - 220;
            ImGui::SameLine(rightX);
            if (ImGui::Button("Undo", ImVec2(56, 34))) undo();
            ImGui::SameLine();
            if (ImGui::Button("Redo", ImVec2(56, 34))) redo();
            ImGui::SameLine();
            if (ImGui::Button("Menu", ImVec2(56, 34))) { /* menu */ }

            ImGui::End();
            ImGui::PopStyleVar(2);

            // Floating cube button below toolbar (like the image)
            ImGui::SetNextWindowPos(ImVec2(12, barH + 8));
            ImGui::SetNextWindowSize(ImVec2(48, 48));
            ImGui::PushStyleVar(ImGuiStyleVar_WindowPadding, ImVec2(4, 4));
            ImGui::Begin("##cube", nullptr,
              ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize |
              ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoScrollbar);
            if (ImGui::Button("Cube", ImVec2(40, 40))) addCube();
            ImGui::End();
            ImGui::PopStyleVar();
          }

          static void drawScene() {
            glClearColor(0.12f, 0.12f, 0.14f, 1.f);
            glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);
            glEnable(GL_DEPTH_TEST);
            // Simple grid + cubes would go here with a basic shader.
            // For now the ImGui overlay is the focus.
          }

          static void frame() {
            if (!g_imgui_init) return;
            ImGuiIO& io = ImGui::GetIO();
            io.DisplaySize = ImVec2((float)g_width, (float)g_height);
            io.DeltaTime = 1.f / 60.f;

            ImGui_ImplOpenGL3_NewFrame();
            ImGui::NewFrame();
            drawToolbar();

            // Status
            ImGui::SetNextWindowPos(ImVec2(12, g_height - 40));
            ImGui::Begin("##status", nullptr,
              ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize |
              ImGuiWindowFlags_AlwaysAutoResize | ImGuiWindowFlags_NoBackground);
            const char* tools[] = {"Move", "Rotate", "Select"};
            ImGui::Text("Tool: %s  |  Cubes: %d", tools[g_tool], (int)g_cubes.size());
            ImGui::End();

            ImGui::Render();
            drawScene();
            ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
            eglSwapBuffers(g_display, g_surface);
          }

          static int32_t onInput(android_app* app, AInputEvent* event) {
            if (!g_imgui_init) return 0;
            ImGuiIO& io = ImGui::GetIO();
            int32_t type = AInputEvent_getType(event);
            if (type == AINPUT_EVENT_TYPE_MOTION) {
              int32_t action = AMotionEvent_getAction(event) & AMOTION_EVENT_ACTION_MASK;
              float x = AMotionEvent_getX(event, 0);
              float y = AMotionEvent_getY(event, 0);
              io.AddMousePosEvent(x, y);
              if (action == AMOTION_EVENT_ACTION_DOWN)
                io.AddMouseButtonEvent(0, true);
              else if (action == AMOTION_EVENT_ACTION_UP || action == AMOTION_EVENT_ACTION_CANCEL)
                io.AddMouseButtonEvent(0, false);
              return io.WantCaptureMouse ? 1 : 0;
            }
            return 0;
          }

          static void onCmd(android_app* app, int32_t cmd) {
            switch (cmd) {
              case APP_CMD_INIT_WINDOW:
                if (app->window) {
                  initEGL(app->window);
                  initImGui();
                  if (g_cubes.empty()) addCube();
                }
                break;
              case APP_CMD_TERM_WINDOW:
                if (g_imgui_init) {
                  ImGui_ImplOpenGL3_Shutdown();
                  ImGui::DestroyContext();
                  g_imgui_init = false;
                }
                termEGL();
                break;
              case APP_CMD_WINDOW_RESIZED:
              case APP_CMD_CONFIG_CHANGED:
                if (g_display != EGL_NO_DISPLAY && g_surface != EGL_NO_SURFACE) {
                  eglQuerySurface(g_display, g_surface, EGL_WIDTH, &g_width);
                  eglQuerySurface(g_display, g_surface, EGL_HEIGHT, &g_height);
                  glViewport(0, 0, g_width, g_height);
                }
                break;
            }
          }

          void android_main(android_app* app) {
            g_app = app;
            app->onAppCmd = onCmd;
            app->onInputEvent = onInput;
            while (true) {
              int events; android_poll_source* source;
              while (ALooper_pollAll(g_imgui_init ? 0 : -1, nullptr, &events, (void**)&source) >= 0) {
                if (source) source->process(app, source);
                if (app->destroyRequested) return;
              }
              if (g_imgui_init && g_display != EGL_NO_DISPLAY) frame();
            }
          }
          EOF

          echo "Project + ImGui created"

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -z "$SDKM" ]; then
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p $ANDROID_HOME/cmdline-tools /tmp/ct
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | $SDKM --licenses >/dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"
          # copy native_app_glue if missing
          NDK=$ANDROID_HOME/ndk/25.1.8937393
          if [ ! -f src/main/cpp/android_native_app_glue.c ]; then
            cp $NDK/sources/android/native_app_glue/android_native_app_glue.c src/main/cpp/
            cp $NDK/sources/android/native_app_glue/android_native_app_glue.h src/main/cpp/
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.4" }

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          find build -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nomad-animator-imgui-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: warn
