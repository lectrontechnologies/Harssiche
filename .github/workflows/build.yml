name: Build Nomad Animator (Qt Quick)
# Arquivo unico: cria o projeto Qt Quick/QML em nomad-qt/, salva no repositorio,
# instala o Qt 6.8 para Android e compila o APK.
on: [push, workflow_dispatch]
permissions:
  contents: write
env:
  QT_VERSION: "6.8.3"
  NDK_VERSION: "26.1.10909125"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Criar arquivos do projeto Qt Quick
        run: |
          set -e
          mkdir -p nomad-qt
          cat > nomad-qt/CMakeLists.txt <<'NOMADEOF'
          cmake_minimum_required(VERSION 3.21)
          project(Nomad VERSION 0.1 LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          find_package(Qt6 6.5 REQUIRED COMPONENTS Quick QuickControls2 Gui OpenGL)
          qt_standard_project_setup(REQUIRES 6.5)

          qt_add_executable(Nomad main.cpp)

          qt_add_qml_module(Nomad
              URI Nomad
              VERSION 1.0
              QML_FILES
                  Main.qml
                  Icon.qml
                  IconButton.qml
                  NomadMenu.qml
                  DarkItem.qml
              SOURCES
                  viewport.h
                  viewport.cpp
                  scene.h
                  shaders.h
                  meshes.h
                  meshes.cpp
          )

          target_link_libraries(Nomad PRIVATE Qt6::Quick Qt6::QuickControls2 Qt6::Gui Qt6::OpenGL)

          if(ANDROID)
              set_target_properties(Nomad PROPERTIES
                  QT_ANDROID_PACKAGE_NAME "com.nomad.animator"
                  QT_ANDROID_VERSION_CODE 1
                  QT_ANDROID_VERSION_NAME "1.0"
                  QT_ANDROID_TARGET_SDK_VERSION 34)
          endif()
          NOMADEOF
          cat > nomad-qt/main.cpp <<'NOMADEOF'
          #include <QGuiApplication>
          #include <QQmlApplicationEngine>
          #include <QQuickStyle>
          #include <QQuickWindow>
          #include <QSurfaceFormat>

          int main(int argc, char *argv[]) {
              // O motor usa OpenGL ES; forcamos o backend OpenGL do Qt Quick.
              QSurfaceFormat fmt;
              fmt.setRenderableType(QSurfaceFormat::OpenGLES);
              fmt.setVersion(3, 0);
              fmt.setDepthBufferSize(24);
              fmt.setStencilBufferSize(8);
              QSurfaceFormat::setDefaultFormat(fmt);
              QQuickWindow::setGraphicsApi(QSGRendererInterface::OpenGL);

              QGuiApplication app(argc, argv);
              QQuickStyle::setStyle("Basic");

              QQmlApplicationEngine engine;
              QObject::connect(
                  &engine, &QQmlApplicationEngine::objectCreationFailed, &app, [] { QCoreApplication::exit(-1); },
                  Qt::QueuedConnection);
              engine.loadFromModule("Nomad", "Main");
              return app.exec();
          }
          NOMADEOF
          cat > nomad-qt/scene.h <<'NOMADEOF'
          #pragma once
          #include <QMatrix4x4>
          #include <QQuaternion>
          #include <QVector3D>
          #include <cmath>
          #include <vector>

          struct Obj {
              int type = 0;
              QVector3D pos{0, 0, 0};
              QQuaternion rot;  // identidade
              QVector3D scl{1, 1, 1};
              QMatrix4x4 model() const {
                  QMatrix4x4 m;
                  m.translate(pos);
                  m.rotate(rot);
                  m.scale(scl);
                  return m;
              }
          };

          struct Scene {
              std::vector<Obj> objs;
              int sel = -1;
          };

          struct Camera {
              float yaw = 35.f, pitch = 25.f, dist = 7.f, fov = 45.f;
              QVector3D target{0, 0.4f, 0};

              QVector3D eye() const {
                  const float k = float(M_PI) / 180.f;
                  float cp = std::cos(pitch * k), sp = std::sin(pitch * k);
                  return target + dist * QVector3D(cp * std::sin(yaw * k), sp, cp * std::cos(yaw * k));
              }
              QVector3D forward() const { return (target - eye()).normalized(); }
              QVector3D right() const { return QVector3D::crossProduct(forward(), QVector3D(0, 1, 0)).normalized(); }
              QVector3D up() const { return QVector3D::crossProduct(right(), forward()); }
              QMatrix4x4 view() const {
                  QMatrix4x4 m;
                  m.lookAt(eye(), target, QVector3D(0, 1, 0));
                  return m;
              }
              QMatrix4x4 proj(float aspect) const {
                  QMatrix4x4 m;
                  m.perspective(fov, aspect, 0.1f, 300.f);
                  return m;
              }
          };
          NOMADEOF
          cat > nomad-qt/shaders.h <<'NOMADEOF'
          #pragma once

          // Malha com matcap (sem PBR): a cor vem so da normal em espaco de vista.
          static const char *kMeshVS = R"GLSL(#version 300 es
          layout(location = 0) in vec3 aPos;
          layout(location = 1) in vec3 aNrm;
          uniform mat4 uMVP;
          uniform mat3 uNrmMat;
          out vec3 vN;
          void main() {
              vN = uNrmMat * aNrm;
              gl_Position = uMVP * vec4(aPos, 1.0);
          }
          )GLSL";

          static const char *kMeshFS = R"GLSL(#version 300 es
          precision highp float;
          in vec3 vN;
          uniform sampler2D uMatcap;
          uniform vec3 uTint;
          uniform float uSel;
          uniform float uFlip;
          out vec4 fragColor;
          void main() {
              vec3 n = normalize(vN);
              if (uFlip > 0.5 && !gl_FrontFacing) n = -n;
              vec2 uv = clamp(n.xy * 0.5 + 0.5, 0.0, 1.0);
              vec3 c = texture(uMatcap, uv).rgb * uTint;
              float rim = pow(clamp(1.0 - abs(n.z), 0.0, 1.0), 2.5);
              c = mix(c, vec3(1.0, 0.62, 0.10), uSel * clamp(rim * 1.4, 0.0, 0.85));
              fragColor = vec4(c, 1.0);
          }
          )GLSL";

          static const char *kLineVS = R"GLSL(#version 300 es
          layout(location = 0) in vec3 aPos;
          uniform mat4 uMVP;
          void main() {
              gl_Position = uMVP * vec4(aPos, 1.0);
          }
          )GLSL";

          static const char *kLineFS = R"GLSL(#version 300 es
          precision mediump float;
          uniform vec4 uColor;
          out vec4 fragColor;
          void main() {
              fragColor = uColor;
          }
          )GLSL";
          NOMADEOF
          cat > nomad-qt/meshes.h <<'NOMADEOF'
          #pragma once
          #include <cstdint>
          #include <vector>

          // Primitivas procedurais (sem dependencia de Qt). Todas cabem em ~1 unidade.
          enum PrimType { PrimCube = 0, PrimSphere, PrimCylinder, PrimCone, PrimTorus, PrimPlane, PrimCount };

          struct MeshData {
              std::vector<float> v;      // interleaved: px py pz nx ny nz
              std::vector<uint16_t> i;   // triangulos
          };

          MeshData makeMesh(int type);
          void primHalfExtents(int type, float out[3]);
          // Textura matcap RGBA8 (N*N*4 bytes), ordem OpenGL (linha 0 = embaixo).
          std::vector<uint8_t> makeMatcap(int n);
          NOMADEOF
          cat > nomad-qt/meshes.cpp <<'NOMADEOF'
          #include "meshes.h"
          #include <cmath>
          #include <algorithm>

          namespace {
          constexpr float kPi = 3.14159265358979f;

          struct V3 {
              float x, y, z;
          };
          V3 operator+(V3 a, V3 b) { return {a.x + b.x, a.y + b.y, a.z + b.z}; }
          V3 operator*(V3 a, float s) { return {a.x * s, a.y * s, a.z * s}; }
          float dot(V3 a, V3 b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
          V3 norm(V3 a) {
              float l = std::sqrt(dot(a, a));
              return l > 1e-8f ? a * (1.f / l) : V3{0, 1, 0};
          }

          void pushV(MeshData &m, V3 p, V3 n) {
              m.v.insert(m.v.end(), {p.x, p.y, p.z, n.x, n.y, n.z});
          }
          void tri(MeshData &m, int a, int b, int c) {
              m.i.push_back(uint16_t(a));
              m.i.push_back(uint16_t(b));
              m.i.push_back(uint16_t(c));
          }
          int vcount(const MeshData &m) { return int(m.v.size() / 6); }

          // Face quadrada: u x v = n, vertices (-,-) (+,-) (+,+) (-,+) => CCW vista de fora.
          void addFace(MeshData &m, V3 n, V3 u, V3 v, V3 center, float half) {
              int base = vcount(m);
              pushV(m, center + u * (-half) + v * (-half), n);
              pushV(m, center + u * (half) + v * (-half), n);
              pushV(m, center + u * (half) + v * (half), n);
              pushV(m, center + u * (-half) + v * (half), n);
              tri(m, base, base + 1, base + 2);
              tri(m, base, base + 2, base + 3);
          }

          MeshData makeCube() {
              MeshData m;
              const V3 X{1, 0, 0}, Y{0, 1, 0}, Z{0, 0, 1};
              addFace(m, X, Y, Z, X * 0.5f, 0.5f);
              addFace(m, X * -1.f, Z, Y, X * -0.5f, 0.5f);
              addFace(m, Y, Z, X, Y * 0.5f, 0.5f);
              addFace(m, Y * -1.f, X, Z, Y * -0.5f, 0.5f);
              addFace(m, Z, X, Y, Z * 0.5f, 0.5f);
              addFace(m, Z * -1.f, Y, X, Z * -0.5f, 0.5f);
              return m;
          }

          MeshData makePlane() {
              MeshData m;
              addFace(m, V3{0, 1, 0}, V3{0, 0, 1}, V3{1, 0, 0}, V3{0, 0, 0}, 0.5f);
              return m;
          }

          MeshData makeSphere(int seg, int rings) {
              MeshData m;
              for (int r = 0; r <= rings; ++r) {
                  float th = kPi * r / rings;
                  for (int s = 0; s <= seg; ++s) {
                      float ph = 2 * kPi * s / seg;
                      V3 n{std::sin(th) * std::cos(ph), std::cos(th), std::sin(th) * std::sin(ph)};
                      pushV(m, n * 0.5f, n);
                  }
              }
              for (int r = 0; r < rings; ++r)
                  for (int s = 0; s < seg; ++s) {
                      int a = r * (seg + 1) + s, b = a + seg + 1;
                      tri(m, a, a + 1, b);
                      tri(m, a + 1, b + 1, b);
                  }
              return m;
          }

          void addCap(MeshData &m, int seg, float r, float y, bool up) {
              V3 n{0, up ? 1.f : -1.f, 0};
              int c = vcount(m);
              pushV(m, V3{0, y, 0}, n);
              for (int s = 0; s <= seg; ++s) {
                  float ph = 2 * kPi * s / seg;
                  pushV(m, V3{r * std::cos(ph), y, r * std::sin(ph)}, n);
              }
              for (int s = 0; s < seg; ++s) {
                  int a = c + 1 + s, b = c + 2 + s;
                  if (up) tri(m, c, b, a);
                  else tri(m, c, a, b);
              }
          }

          MeshData makeFrustum(int seg, float rTop, float rBot, bool capTop, bool capBot) {
              MeshData m;
              const float h = 1.f;
              for (int s = 0; s <= seg; ++s) {
                  float ph = 2 * kPi * s / seg, c = std::cos(ph), sn = std::sin(ph);
                  V3 n = norm(V3{c * h, rBot - rTop, sn * h});
                  pushV(m, V3{rTop * c, 0.5f, rTop * sn}, n);
                  pushV(m, V3{rBot * c, -0.5f, rBot * sn}, n);
              }
              for (int s = 0; s < seg; ++s) {
                  int a = 2 * s, a1 = 2 * (s + 1), b = 2 * s + 1, b1 = 2 * (s + 1) + 1;
                  tri(m, a, a1, b);
                  tri(m, a1, b1, b);
              }
              if (capTop) addCap(m, seg, rTop, 0.5f, true);
              if (capBot) addCap(m, seg, rBot, -0.5f, false);
              return m;
          }

          MeshData makeTorus(int seg, int tube) {
              MeshData m;
              const float R = 0.35f, r = 0.15f;
              for (int i = 0; i <= seg; ++i) {
                  float u = 2 * kPi * i / seg;
                  for (int j = 0; j <= tube; ++j) {
                      float v = 2 * kPi * j / tube;
                      V3 n{std::cos(v) * std::cos(u), std::sin(v), std::cos(v) * std::sin(u)};
                      V3 p{(R + r * std::cos(v)) * std::cos(u), r * std::sin(v), (R + r * std::cos(v)) * std::sin(u)};
                      pushV(m, p, n);
                  }
              }
              for (int i = 0; i < seg; ++i)
                  for (int j = 0; j < tube; ++j) {
                      int a = i * (tube + 1) + j, b = (i + 1) * (tube + 1) + j;
                      tri(m, a, a + 1, b);
                      tri(m, a + 1, b + 1, b);
                  }
              return m;
          }

          float clamp01(float x) { return std::min(1.f, std::max(0.f, x)); }
          }  // namespace

          MeshData makeMesh(int type) {
              switch (type) {
              case PrimSphere: return makeSphere(32, 16);
              case PrimCylinder: return makeFrustum(32, 0.5f, 0.5f, true, true);
              case PrimCone: return makeFrustum(32, 0.f, 0.5f, false, true);
              case PrimTorus: return makeTorus(32, 16);
              case PrimPlane: return makePlane();
              default: return makeCube();
              }
          }

          void primHalfExtents(int type, float o[3]) {
              o[0] = o[1] = o[2] = 0.5f;
              if (type == PrimTorus) o[1] = 0.15f;
              if (type == PrimPlane) o[1] = 0.02f;
          }

          // Matcap procedural: azul suave, luz principal no alto a esquerda, preenchimento,
          // brilho especular e leve luz de contorno. Pode ser trocado por uma imagem depois.
          std::vector<uint8_t> makeMatcap(int N) {
              std::vector<uint8_t> px(size_t(N) * N * 4);
              const V3 L1 = norm({-0.45f, 0.65f, 0.62f});
              const V3 L2 = norm({0.70f, -0.20f, 0.35f});
              const V3 Vw{0, 0, 1};
              const V3 H = norm(L1 + Vw);
              const V3 base{0.42f, 0.47f, 0.86f};
              for (int y = 0; y < N; ++y)
                  for (int x = 0; x < N; ++x) {
                      float fx = (x + 0.5f) / N * 2.f - 1.f, fy = (y + 0.5f) / N * 2.f - 1.f;
                      float r2 = fx * fx + fy * fy;
                      V3 n = r2 < 1.f ? V3{fx, fy, std::sqrt(1.f - r2)} : norm({fx, fy, 0.f});
                      float d1 = std::max(0.f, dot(n, L1)), d2 = std::max(0.f, dot(n, L2));
                      float hemi = 0.5f + 0.5f * n.y;
                      float k = 0.30f + 0.80f * d1 + 0.22f * d2 + 0.25f * hemi;
                      V3 c = base * k;
                      float spec = std::pow(std::max(0.f, dot(n, H)), 48.f) * 0.55f;
                      c = c + V3{0.90f, 0.93f, 1.0f} * spec;
                      float rim = std::pow(clamp01(1.f - n.z), 3.f) * 0.18f;
                      c = c + V3{0.55f, 0.65f, 1.0f} * rim;
                      uint8_t *o = &px[(size_t(y) * N + x) * 4];
                      o[0] = uint8_t(clamp01(c.x) * 255.f + 0.5f);
                      o[1] = uint8_t(clamp01(c.y) * 255.f + 0.5f);
                      o[2] = uint8_t(clamp01(c.z) * 255.f + 0.5f);
                      o[3] = 255;
                  }
              return px;
          }
          NOMADEOF
          cat > nomad-qt/viewport.h <<'NOMADEOF'
          #pragma once
          #include <QElapsedTimer>
          #include <QHash>
          #include <QPointF>
          #include <QQuickFramebufferObject>
          #include <QtQml/qqml.h>
          #include <vector>

          #include "scene.h"

          class ViewportItem : public QQuickFramebufferObject {
              Q_OBJECT
              QML_NAMED_ELEMENT(Viewport)
              Q_PROPERTY(int tool READ tool WRITE setTool NOTIFY toolChanged)
              Q_PROPERTY(bool canUndo READ canUndo NOTIFY historyChanged)
              Q_PROPERTY(bool canRedo READ canRedo NOTIFY historyChanged)
              Q_PROPERTY(int objectCount READ objectCount NOTIFY sceneChanged)

          public:
              explicit ViewportItem(QQuickItem *parent = nullptr);
              Renderer *createRenderer() const override;

              int tool() const { return m_tool; }
              void setTool(int t);
              bool canUndo() const { return !m_undo.empty(); }
              bool canRedo() const { return !m_redo.empty(); }
              int objectCount() const { return int(m_scene.objs.size()); }

              const Scene &scene() const { return m_scene; }
              const Camera &camera() const { return m_cam; }

              Q_INVOKABLE void addPrimitive(int type);
              Q_INVOKABLE void deleteSelected();
              Q_INVOKABLE void newScene();
              Q_INVOKABLE void undo();
              Q_INVOKABLE void redo();

          signals:
              void toolChanged();
              void historyChanged();
              void sceneChanged();

          protected:
              void touchEvent(QTouchEvent *ev) override;
              void touchUngrabEvent() override;

          private:
              enum Mode { Idle, Undecided, Orbit, Transform, Gesture };

              void commit(const Scene &before);
              int pickAt(const QPointF &p) const;
              void applyTransform(const QPointF &d);
              void orbit(const QPointF &d);
              void panZoom(const QPointF &midDelta, float zoomRatio);
              float worldPerPixel(float distance) const;

              Scene m_scene;
              Camera m_cam;
              int m_tool = 0;  // 0 mover, 1 rotacionar, 2 escalar
              std::vector<Scene> m_undo, m_redo;

              // estado do toque
              Mode m_mode = Idle;
              QHash<int, QPointF> m_pts;
              QPointF m_press;
              QElapsedTimer m_pressTimer;
              float m_moved = 0.f;
              int m_hit = -1;
              Scene m_before;
              bool m_changed = false;
              float m_lastDist = 0.f;
              QPointF m_lastMid;
          };
          NOMADEOF
          cat > nomad-qt/viewport.cpp <<'NOMADEOF'
          #include "viewport.h"

          #include <QOpenGLExtraFunctions>
          #include <QOpenGLFramebufferObject>
          #include <QQuickOpenGLUtils>
          #include <QTouchEvent>
          #include <algorithm>
          #include <cmath>

          #include "meshes.h"
          #include "shaders.h"

          // ---------------------------------------------------------------------------
          // Renderer (thread de render do Qt Quick)
          // ---------------------------------------------------------------------------
          class ViewportRenderer : public QQuickFramebufferObject::Renderer, protected QOpenGLExtraFunctions {
          public:
              QOpenGLFramebufferObject *createFramebufferObject(const QSize &size) override {
                  QOpenGLFramebufferObjectFormat f;
                  f.setAttachment(QOpenGLFramebufferObject::CombinedDepthStencil);
                  f.setSamples(4);
                  return new QOpenGLFramebufferObject(size, f);
              }

              void synchronize(QQuickFramebufferObject *item) override {
                  auto *v = static_cast<ViewportItem *>(item);
                  m_scene = v->scene();
                  m_cam = v->camera();
              }

              void render() override {
                  if (!m_inited) init();
                  const QSize sz = framebufferObject()->size();
                  glViewport(0, 0, sz.width(), sz.height());
                  glDisable(GL_SCISSOR_TEST);
                  glDisable(GL_CULL_FACE);
                  glDisable(GL_BLEND);
                  glEnable(GL_DEPTH_TEST);
                  glDepthFunc(GL_LEQUAL);
                  glDepthMask(GL_TRUE);
                  glClearColor(0.55f, 0.55f, 0.57f, 1.f);
                  glClearDepthf(1.f);
                  glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT | GL_STENCIL_BUFFER_BIT);

                  const float aspect = sz.height() > 0 ? float(sz.width()) / float(sz.height()) : 1.f;
                  const QMatrix4x4 V = m_cam.view();
                  const QMatrix4x4 PV = m_cam.proj(aspect) * V;

                  drawGrid(PV);
                  drawMeshes(V, PV);

                  QQuickOpenGLUtils::resetOpenGLState();
              }

          private:
              struct Gpu {
                  GLuint vao = 0, vbo = 0, ibo = 0;
                  GLsizei count = 0;
              };

              GLuint compile(GLenum type, const char *src) {
                  GLuint s = glCreateShader(type);
                  glShaderSource(s, 1, &src, nullptr);
                  glCompileShader(s);
                  GLint ok = 0;
                  glGetShaderiv(s, GL_COMPILE_STATUS, &ok);
                  if (!ok) {
                      char log[1024];
                      glGetShaderInfoLog(s, sizeof(log), nullptr, log);
                      qWarning("Shader: %s", log);
                  }
                  return s;
              }

              GLuint link(const char *vs, const char *fs) {
                  GLuint v = compile(GL_VERTEX_SHADER, vs), f = compile(GL_FRAGMENT_SHADER, fs);
                  GLuint p = glCreateProgram();
                  glAttachShader(p, v);
                  glAttachShader(p, f);
                  glLinkProgram(p);
                  GLint ok = 0;
                  glGetProgramiv(p, GL_LINK_STATUS, &ok);
                  if (!ok) {
                      char log[1024];
                      glGetProgramInfoLog(p, sizeof(log), nullptr, log);
                      qWarning("Link: %s", log);
                  }
                  glDeleteShader(v);
                  glDeleteShader(f);
                  return p;
              }

              void init() {
                  initializeOpenGLFunctions();

                  m_meshProg = link(kMeshVS, kMeshFS);
                  uMVP = glGetUniformLocation(m_meshProg, "uMVP");
                  uNrm = glGetUniformLocation(m_meshProg, "uNrmMat");
                  uMatcap = glGetUniformLocation(m_meshProg, "uMatcap");
                  uTint = glGetUniformLocation(m_meshProg, "uTint");
                  uSel = glGetUniformLocation(m_meshProg, "uSel");
                  uFlip = glGetUniformLocation(m_meshProg, "uFlip");

                  m_lineProg = link(kLineVS, kLineFS);
                  lMVP = glGetUniformLocation(m_lineProg, "uMVP");
                  lColor = glGetUniformLocation(m_lineProg, "uColor");

                  for (int t = 0; t < PrimCount; ++t) {
                      MeshData md = makeMesh(t);
                      Gpu &g = m_gpu[t];
                      glGenVertexArrays(1, &g.vao);
                      glBindVertexArray(g.vao);
                      glGenBuffers(1, &g.vbo);
                      glBindBuffer(GL_ARRAY_BUFFER, g.vbo);
                      glBufferData(GL_ARRAY_BUFFER, GLsizeiptr(md.v.size() * sizeof(float)), md.v.data(), GL_STATIC_DRAW);
                      glGenBuffers(1, &g.ibo);
                      glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, g.ibo);
                      glBufferData(GL_ELEMENT_ARRAY_BUFFER, GLsizeiptr(md.i.size() * sizeof(uint16_t)), md.i.data(),
                                   GL_STATIC_DRAW);
                      glEnableVertexAttribArray(0);
                      glVertexAttribPointer(0, 3, GL_FLOAT, GL_FALSE, 6 * sizeof(float), nullptr);
                      glEnableVertexAttribArray(1);
                      glVertexAttribPointer(1, 3, GL_FLOAT, GL_FALSE, 6 * sizeof(float),
                                            reinterpret_cast<const void *>(3 * sizeof(float)));
                      glBindVertexArray(0);
                      g.count = GLsizei(md.i.size());
                  }

                  // grade 20x20 + eixos X e Z
                  std::vector<float> gv;
                  const int n = 10;
                  for (int i = -n; i <= n; ++i) {
                      gv.insert(gv.end(), {float(i), 0.f, float(-n), float(i), 0.f, float(n)});
                      gv.insert(gv.end(), {float(-n), 0.f, float(i), float(n), 0.f, float(i)});
                  }
                  m_gridCount = GLsizei(gv.size() / 3);
                  gv.insert(gv.end(), {-float(n), 0.f, 0.f, float(n), 0.f, 0.f});  // eixo X
                  gv.insert(gv.end(), {0.f, 0.f, -float(n), 0.f, 0.f, float(n)});  // eixo Z
                  glGenVertexArrays(1, &m_gridVao);
                  glBindVertexArray(m_gridVao);
                  glGenBuffers(1, &m_gridVbo);
                  glBindBuffer(GL_ARRAY_BUFFER, m_gridVbo);
                  glBufferData(GL_ARRAY_BUFFER, GLsizeiptr(gv.size() * sizeof(float)), gv.data(), GL_STATIC_DRAW);
                  glEnableVertexAttribArray(0);
                  glVertexAttribPointer(0, 3, GL_FLOAT, GL_FALSE, 3 * sizeof(float), nullptr);
                  glBindVertexArray(0);

                  // matcap
                  const int N = 256;
                  std::vector<uint8_t> px = makeMatcap(N);
                  glGenTextures(1, &m_tex);
                  glBindTexture(GL_TEXTURE_2D, m_tex);
                  glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, N, N, 0, GL_RGBA, GL_UNSIGNED_BYTE, px.data());
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
                  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);

                  m_inited = true;
              }

              void drawGrid(const QMatrix4x4 &PV) {
                  glUseProgram(m_lineProg);
                  glUniformMatrix4fv(lMVP, 1, GL_FALSE, PV.constData());
                  glEnable(GL_BLEND);
                  glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);
                  glBindVertexArray(m_gridVao);
                  glUniform4f(lColor, 0.30f, 0.30f, 0.33f, 0.45f);
                  glDrawArrays(GL_LINES, 0, m_gridCount);
                  glUniform4f(lColor, 0.85f, 0.30f, 0.30f, 0.90f);
                  glDrawArrays(GL_LINES, m_gridCount, 2);
                  glUniform4f(lColor, 0.30f, 0.45f, 0.90f, 0.90f);
                  glDrawArrays(GL_LINES, m_gridCount + 2, 2);
                  glBindVertexArray(0);
                  glDisable(GL_BLEND);
              }

              void drawMeshes(const QMatrix4x4 &V, const QMatrix4x4 &PV) {
                  glUseProgram(m_meshProg);
                  glActiveTexture(GL_TEXTURE0);
                  glBindTexture(GL_TEXTURE_2D, m_tex);
                  glUniform1i(uMatcap, 0);
                  glUniform3f(uTint, 1.f, 1.f, 1.f);
                  for (size_t i = 0; i < m_scene.objs.size(); ++i) {
                      const Obj &o = m_scene.objs[i];
                      if (o.type < 0 || o.type >= PrimCount) continue;
                      const QMatrix4x4 M = o.model();
                      const QMatrix4x4 MVP = PV * M;
                      const QMatrix3x3 NM = (V * M).normalMatrix();
                      glUniformMatrix4fv(uMVP, 1, GL_FALSE, MVP.constData());
                      glUniformMatrix3fv(uNrm, 1, GL_FALSE, NM.constData());
                      glUniform1f(uSel, int(i) == m_scene.sel ? 1.f : 0.f);
                      glUniform1f(uFlip, o.type == PrimPlane ? 1.f : 0.f);
                      const Gpu &g = m_gpu[o.type];
                      glBindVertexArray(g.vao);
                      glDrawElements(GL_TRIANGLES, g.count, GL_UNSIGNED_SHORT, nullptr);
                  }
                  glBindVertexArray(0);
              }

              bool m_inited = false;
              Scene m_scene;
              Camera m_cam;
              GLuint m_meshProg = 0, m_lineProg = 0, m_tex = 0, m_gridVao = 0, m_gridVbo = 0;
              GLsizei m_gridCount = 0;
              GLint uMVP = -1, uNrm = -1, uMatcap = -1, uTint = -1, uSel = -1, uFlip = -1, lMVP = -1, lColor = -1;
              Gpu m_gpu[PrimCount];
          };

          // ---------------------------------------------------------------------------
          // Item QML (thread da interface): cena, camera, toques, desfazer/refazer
          // ---------------------------------------------------------------------------
          ViewportItem::ViewportItem(QQuickItem *parent) : QQuickFramebufferObject(parent) {
              setAcceptTouchEvents(true);
              setAcceptedMouseButtons(Qt::NoButton);
              Obj cube;
              cube.type = PrimCube;
              cube.pos = QVector3D(0, 0.5f, 0);
              m_scene.objs.push_back(cube);
          }

          QQuickFramebufferObject::Renderer *ViewportItem::createRenderer() const {
              return new ViewportRenderer;
          }

          void ViewportItem::setTool(int t) {
              t = std::clamp(t, 0, 2);
              if (t == m_tool) return;
              m_tool = t;
              emit toolChanged();
          }

          void ViewportItem::commit(const Scene &before) {
              m_undo.push_back(before);
              if (m_undo.size() > 100) m_undo.erase(m_undo.begin());
              m_redo.clear();
              emit historyChanged();
              emit sceneChanged();
              update();
          }

          void ViewportItem::addPrimitive(int type) {
              if (type < 0 || type >= PrimCount) return;
              const Scene before = m_scene;
              float he[3];
              primHalfExtents(type, he);
              Obj o;
              o.type = type;
              o.pos = QVector3D(m_cam.target.x(), he[1], m_cam.target.z());
              m_scene.objs.push_back(o);
              m_scene.sel = int(m_scene.objs.size()) - 1;
              commit(before);
          }

          void ViewportItem::deleteSelected() {
              if (m_scene.sel < 0 || m_scene.sel >= int(m_scene.objs.size())) return;
              const Scene before = m_scene;
              m_scene.objs.erase(m_scene.objs.begin() + m_scene.sel);
              m_scene.sel = -1;
              commit(before);
          }

          void ViewportItem::newScene() {
              if (m_scene.objs.empty()) return;
              const Scene before = m_scene;
              m_scene.objs.clear();
              m_scene.sel = -1;
              commit(before);
          }

          void ViewportItem::undo() {
              if (m_undo.empty()) return;
              m_redo.push_back(m_scene);
              m_scene = m_undo.back();
              m_undo.pop_back();
              emit historyChanged();
              emit sceneChanged();
              update();
          }

          void ViewportItem::redo() {
              if (m_redo.empty()) return;
              m_undo.push_back(m_scene);
              m_scene = m_redo.back();
              m_redo.pop_back();
              emit historyChanged();
              emit sceneChanged();
              update();
          }

          float ViewportItem::worldPerPixel(float distance) const {
              const float k = float(M_PI) / 180.f;
              return 2.f * distance * std::tan(m_cam.fov * 0.5f * k) / std::max(1.f, float(height()));
          }

          // Raio de toque contra a caixa de cada objeto (no espaco local do objeto).
          int ViewportItem::pickAt(const QPointF &p) const {
              const float w = float(width()), h = float(height());
              if (w < 1.f || h < 1.f) return -1;
              bool ok = false;
              const QMatrix4x4 inv = (m_cam.proj(w / h) * m_cam.view()).inverted(&ok);
              if (!ok) return -1;
              const float nx = 2.f * float(p.x()) / w - 1.f, ny = 1.f - 2.f * float(p.y()) / h;
              const QVector4D n4 = inv.map(QVector4D(nx, ny, -1.f, 1.f));
              const QVector4D f4 = inv.map(QVector4D(nx, ny, 1.f, 1.f));
              const QVector3D a = n4.toVector3D() / n4.w();
              const QVector3D b = f4.toVector3D() / f4.w();
              const QVector3D dir = b - a;

              int best = -1;
              float bestT = 1e30f;
              for (size_t i = 0; i < m_scene.objs.size(); ++i) {
                  const Obj &o = m_scene.objs[i];
                  bool ok2 = false;
                  const QMatrix4x4 mi = o.model().inverted(&ok2);
                  if (!ok2) continue;
                  const QVector3D lo = mi.map(a);
                  const QVector3D ld = mi.mapVector(dir);
                  float he[3];
                  primHalfExtents(o.type, he);
                  float tmin = 0.f, tmax = 1e30f;
                  bool hit = true;
                  for (int k = 0; k < 3 && hit; ++k) {
                      const float oc = lo[k], dc = ld[k];
                      if (std::fabs(dc) < 1e-8f) {
                          if (oc < -he[k] || oc > he[k]) hit = false;
                      } else {
                          float t1 = (-he[k] - oc) / dc, t2 = (he[k] - oc) / dc;
                          if (t1 > t2) std::swap(t1, t2);
                          tmin = std::max(tmin, t1);
                          tmax = std::min(tmax, t2);
                          if (tmin > tmax) hit = false;
                      }
                  }
                  if (hit && tmin < bestT) {
                      bestT = tmin;
                      best = int(i);
                  }
              }
              return best;
          }

          void ViewportItem::orbit(const QPointF &d) {
              m_cam.yaw -= float(d.x()) * 0.4f;
              m_cam.pitch = std::clamp(m_cam.pitch + float(d.y()) * 0.4f, -89.f, 89.f);
          }

          void ViewportItem::panZoom(const QPointF &d, float zoomRatio) {
              const float wpp = worldPerPixel(m_cam.dist);
              const QVector3D r = m_cam.right(), u = m_cam.up();
              m_cam.target += -r * (float(d.x()) * wpp) + u * (float(d.y()) * wpp);
              if (zoomRatio > 0.01f) m_cam.dist = std::clamp(m_cam.dist / zoomRatio, 0.5f, 120.f);
          }

          void ViewportItem::applyTransform(const QPointF &d) {
              if (m_scene.sel < 0 || m_scene.sel >= int(m_scene.objs.size())) return;
              Obj &o = m_scene.objs[size_t(m_scene.sel)];
              const QVector3D r = m_cam.right(), u = m_cam.up();
              switch (m_tool) {
              case 0: {  // mover no plano da tela
                  const float wpp = worldPerPixel((o.pos - m_cam.eye()).length());
                  o.pos += r * (float(d.x()) * wpp) - u * (float(d.y()) * wpp);
                  break;
              }
              case 1: {  // rotacionar
                  const QQuaternion qy = QQuaternion::fromAxisAndAngle(QVector3D(0, 1, 0), float(d.x()) * 0.5f);
                  const QQuaternion qx = QQuaternion::fromAxisAndAngle(r, float(d.y()) * 0.5f);
                  o.rot = (qy * qx * o.rot).normalized();
                  break;
              }
              default: {  // escalar (arrastar para cima aumenta)
                  const float k = std::exp(-float(d.y()) * 0.005f);
                  o.scl = QVector3D(std::clamp(o.scl.x() * k, 0.05f, 50.f), std::clamp(o.scl.y() * k, 0.05f, 50.f),
                                    std::clamp(o.scl.z() * k, 0.05f, 50.f));
                  break;
              }
              }
          }

          void ViewportItem::touchUngrabEvent() {
              if (m_mode == Transform && m_changed) commit(m_before);
              m_pts.clear();
              m_mode = Idle;
          }

          void ViewportItem::touchEvent(QTouchEvent *ev) {
              const auto &points = ev->points();

              // 1) novos toques
              for (const QEventPoint &p : points) {
                  if (p.state() != QEventPoint::Pressed) continue;
                  m_pts.insert(p.id(), p.position());
                  if (m_pts.size() == 1) {
                      m_mode = Undecided;
                      m_press = p.position();
                      m_pressTimer.start();
                      m_moved = 0.f;
                      m_hit = pickAt(p.position());
                      m_changed = false;
                  } else if (m_pts.size() == 2) {
                      if (m_mode == Transform && m_changed) commit(m_before);
                      m_mode = Gesture;
                      const QList<int> keys = m_pts.keys();
                      const QPointF a = m_pts.value(keys[0]), b = m_pts.value(keys[1]);
                      m_lastDist = float(std::hypot(a.x() - b.x(), a.y() - b.y()));
                      m_lastMid = (a + b) * 0.5;
                  }
              }

              // 2) movimentos
              bool moved = false;
              QPointF delta;
              for (const QEventPoint &p : points) {
                  if (p.state() != QEventPoint::Updated || !m_pts.contains(p.id())) continue;
                  delta = p.position() - m_pts.value(p.id());
                  m_pts[p.id()] = p.position();
                  moved = true;
              }
              if (moved) {
                  if (m_pts.size() == 1 && m_mode != Gesture) {
                      if (m_mode == Undecided) {
                          m_moved += float(std::hypot(delta.x(), delta.y()));
                          if (m_moved > 8.f) {
                              if (m_hit >= 0 && m_hit == m_scene.sel) {
                                  m_mode = Transform;
                                  m_before = m_scene;
                                  m_changed = false;
                              } else {
                                  m_mode = Orbit;
                              }
                          }
                      }
                      if (m_mode == Orbit) {
                          orbit(delta);
                          update();
                      } else if (m_mode == Transform) {
                          applyTransform(delta);
                          m_changed = true;
                          update();
                      }
                  } else if (m_pts.size() >= 2 && m_mode == Gesture) {
                      QList<int> keys = m_pts.keys();
                      std::sort(keys.begin(), keys.end());
                      const QPointF a = m_pts.value(keys[0]), b = m_pts.value(keys[1]);
                      const float dist = float(std::hypot(a.x() - b.x(), a.y() - b.y()));
                      const QPointF mid = (a + b) * 0.5;
                      const float ratio = m_lastDist > 1.f ? dist / m_lastDist : 1.f;
                      panZoom(mid - m_lastMid, ratio);
                      m_lastDist = dist;
                      m_lastMid = mid;
                      update();
                  }
              }

              // 3) toques soltos
              for (const QEventPoint &p : points) {
                  if (p.state() == QEventPoint::Released) m_pts.remove(p.id());
              }
              if (m_pts.isEmpty() && m_mode != Idle) {
                  if (m_mode == Undecided && m_pressTimer.elapsed() < 400) {
                      if (m_scene.sel != m_hit) {
                          m_scene.sel = m_hit;
                          emit sceneChanged();
                          update();
                      }
                  } else if (m_mode == Transform && m_changed) {
                      commit(m_before);
                  }
                  m_mode = Idle;
              }
              ev->accept();
          }
          NOMADEOF
          cat > nomad-qt/Main.qml <<'NOMADEOF'
          import QtQuick
          import QtQuick.Controls.Basic
          import Nomad

          ApplicationWindow {
              id: win
              visible: true
              width: 1280
              height: 720
              title: "Nomad Animator"
              color: "#8c8c91"

              // Viewport 3D (OpenGL ES, matcap)
              Viewport {
                  id: vp
                  anchors.fill: parent
              }

              // Ferramentas de transformacao (canto superior esquerdo)
              Rectangle {
                  id: tools
                  x: 8
                  y: 8
                  width: toolRow.width
                  height: toolRow.height
                  color: "#282828"

                  Row {
                      id: toolRow
                      IconButton { icon: "move"; active: vp.tool === 0; onClicked: vp.tool = 0 }
                      IconButton { icon: "rotate"; active: vp.tool === 1; onClicked: vp.tool = 1 }
                      IconButton { icon: "scale"; active: vp.tool === 2; onClicked: vp.tool = 2 }
                  }
              }

              // Botao de primitivas (abaixo das ferramentas)
              IconButton {
                  id: cubeBtn
                  x: 8
                  y: tools.y + tools.height
                  icon: "cube"
                  onClicked: primMenu.popup(cubeBtn, cubeBtn.width + 4, 0)
              }

              // Desfazer / refazer / menu (canto superior direito)
              Rectangle {
                  id: topRight
                  x: win.width - width - 8
                  y: 8
                  width: trRow.width
                  height: trRow.height
                  color: "#282828"

                  Row {
                      id: trRow
                      IconButton { icon: "undo"; dimmed: !vp.canUndo; onClicked: vp.undo() }
                      IconButton { icon: "redo"; dimmed: !vp.canRedo; onClicked: vp.redo() }
                      IconButton { id: menuBtn; icon: "menu"; onClicked: mainMenu.popup(menuBtn, menuBtn.width - 200, menuBtn.height + 4) }
                  }
              }

              NomadMenu {
                  id: primMenu
                  DarkItem { text: "Cubo"; onTriggered: vp.addPrimitive(0) }
                  DarkItem { text: "Esfera"; onTriggered: vp.addPrimitive(1) }
                  DarkItem { text: "Cilindro"; onTriggered: vp.addPrimitive(2) }
                  DarkItem { text: "Cone"; onTriggered: vp.addPrimitive(3) }
                  DarkItem { text: "Toroide"; onTriggered: vp.addPrimitive(4) }
                  DarkItem { text: "Plano"; onTriggered: vp.addPrimitive(5) }
              }

              NomadMenu {
                  id: mainMenu
                  DarkItem { text: "Excluir objeto"; onTriggered: vp.deleteSelected() }
                  DarkItem { text: "Nova cena"; onTriggered: vp.newScene() }
              }
          }
