name: Build Nomad Animator (Qt Quick)
# Arquivo unico: motor (Vulkan + Slang, glTF, video...) dentro de um app Qt Quick/QML.
# Cria o projeto em nomad-qt/, salva no repositorio e compila o APK com Qt 6.8 para Android.
