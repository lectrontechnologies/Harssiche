name: Build Nomad Animator (Qt 6.5)
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 python3-pip

      - name: Install aqtinstall
        run: pip3 install aqtinstall==3.1.16

      - name: Install Qt 6.5.3 Desktop + Android
        run: |
          set -e
          mkdir -p $HOME/Qt
          aqt install-qt linux desktop 6.5.3 gcc_64 -O $HOME/Qt
          aqt install-qt linux android 6.5.3 android_arm64_v8a -O $HOME/Qt
          ls -la $HOME/Qt/6.5.3/

      - name: Android SDK + NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -z "$SDKM" ]; then
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p $ANDROID_HOME/cmdline-tools /tmp/ct
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          fi
          yes | $SDKM --licenses >/dev/null || true
          $SDKM "platforms;android-34" "platforms;android-33" "build-tools;34.0.0" "ndk;25.1.8937393"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Create project files
        run: |
          # Remove arquivos do projeto nativo antigo
          rm -f settings.gradle build.gradle
          rm -rf .gradle

          mkdir -p src android/res/values
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(NomadAnimator LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_AUTOMOC ON)
          find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets OpenGL OpenGLWidgets)
          qt_add_executable(NomadAnimator
            src/main.cpp src/mainwindow.cpp src/mainwindow.h
            src/glwidget.cpp src/glwidget.h)
          target_link_libraries(NomadAnimator PRIVATE
            Qt6::Core Qt6::Gui Qt6::Widgets Qt6::OpenGL Qt6::OpenGLWidgets)
          set_target_properties(NomadAnimator PROPERTIES
            QT_ANDROID_PACKAGE_SOURCE_DIR "${CMAKE_CURRENT_SOURCE_DIR}/android"
            QT_ANDROID_PACKAGE_NAME "com.nomad.animator"
            QT_ANDROID_APP_NAME "Nomad Animator"
            QT_ANDROID_TARGET_SDK_VERSION 34
            QT_ANDROID_MIN_SDK_VERSION 24
            QT_ANDROID_ABIS "arm64-v8a")
          EOF

          cat > src/main.cpp << 'EOF'
          #include <QApplication>
          #include <QSurfaceFormat>
          #include "mainwindow.h"
          int main(int argc, char *argv[]) {
            QSurfaceFormat fmt; fmt.setVersion(3,0); fmt.setProfile(QSurfaceFormat::CoreProfile);
            QSurfaceFormat::setDefaultFormat(fmt);
            QApplication app(argc, argv); app.setStyle("Fusion");
            MainWindow w; w.show(); return app.exec();
          }
          EOF

          cat > src/mainwindow.h << 'EOF'
          #pragma once
          #include <QMainWindow>
          #include <QToolBar>
          #include <QToolButton>
          class GLWidget;
          class MainWindow : public QMainWindow {
            Q_OBJECT
          public:
            explicit MainWindow(QWidget *parent = nullptr);
          private slots:
            void onMove(); void onRotate(); void onSelect();
            void onAddCube(); void onUndo(); void onRedo(); void onMenu();
          private:
            void createToolbars();
            QIcon makeMoveIcon(); QIcon makeRotateIcon(); QIcon makeSelectIcon();
            QIcon makeCubeIcon(); QIcon makeUndoIcon(); QIcon makeRedoIcon(); QIcon makeMenuIcon();
            GLWidget *m_gl = nullptr;
            QToolButton *m_cubeBtn = nullptr;
          };
          EOF

          cat > src/mainwindow.cpp << 'EOF'
          #include "mainwindow.h"
          #include "glwidget.h"
          #include <QPainter>
          #include <QPixmap>
          #include <QApplication>
          #include <QMessageBox>
          #include <QActionGroup>
          MainWindow::MainWindow(QWidget *parent) : QMainWindow(parent) {
            setWindowTitle("Nomad Animator"); resize(1280,720);
            m_gl = new GLWidget(this); setCentralWidget(m_gl); createToolbars();
            qApp->setStyleSheet("QMainWindow,QWidget{background:#1e1e1e;color:#e0e0e0;}QToolBar{background:#2a2a2a;border:none;spacing:4px;padding:4px;}QToolButton{background:transparent;border:none;border-radius:6px;padding:6px;min-width:36px;min-height:36px;}QToolButton:hover{background:#3a3a3a;}QToolButton:checked,QToolButton:pressed{background:#3d5a80;}");
          }
          void MainWindow::createToolbars() {
            QToolBar *left = addToolBar("Tools"); left->setMovable(false); left->setIconSize(QSize(28,28));
            QAction *a1=left->addAction(makeMoveIcon(),"Mover",this,&MainWindow::onMove); a1->setCheckable(true); a1->setChecked(true);
            QAction *a2=left->addAction(makeRotateIcon(),"Rotacionar",this,&MainWindow::onRotate); a2->setCheckable(true);
            QAction *a3=left->addAction(makeSelectIcon(),"Selecionar",this,&MainWindow::onSelect); a3->setCheckable(true);
            QActionGroup *g=new QActionGroup(this); g->addAction(a1); g->addAction(a2); g->addAction(a3); g->setExclusive(true);
            m_cubeBtn=new QToolButton(this); m_cubeBtn->setIcon(makeCubeIcon()); m_cubeBtn->setIconSize(QSize(32,32)); m_cubeBtn->setFixedSize(48,48);
            m_cubeBtn->setStyleSheet("QToolButton{background:#2a2a2a;border-radius:8px;}QToolButton:hover{background:#3a3a3a;}");
            connect(m_cubeBtn,&QToolButton::clicked,this,&MainWindow::onAddCube); m_cubeBtn->move(12,56); m_cubeBtn->show();
            QToolBar *right=addToolBar("Actions"); right->setMovable(false); right->setIconSize(QSize(26,26));
            QWidget *sp=new QWidget; sp->setSizePolicy(QSizePolicy::Expanding,QSizePolicy::Preferred); right->addWidget(sp);
            right->addAction(makeUndoIcon(),"Desfazer",this,&MainWindow::onUndo);
            right->addAction(makeRedoIcon(),"Refazer",this,&MainWindow::onRedo);
            right->addAction(makeMenuIcon(),"Menu",this,&MainWindow::onMenu);
          }
          QIcon MainWindow::makeMoveIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);p.setPen(QPen(Qt::white,4,Qt::SolidLine,Qt::RoundCap,Qt::RoundJoin));p.drawLine(12,32,52,32);p.drawLine(12,32,22,22);p.drawLine(12,32,22,42);p.drawLine(52,32,42,22);p.drawLine(52,32,42,42);return QIcon(px);}
          QIcon MainWindow::makeRotateIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);p.setPen(QPen(Qt::white,4,Qt::SolidLine,Qt::RoundCap,Qt::RoundJoin));p.drawArc(14,14,36,36,40*16,280*16);p.drawLine(48,22,42,14);p.drawLine(48,22,54,18);return QIcon(px);}
          QIcon MainWindow::makeSelectIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);QPen pen(Qt::white,3,Qt::DashLine);pen.setDashPattern({4,3});p.setPen(pen);p.drawRoundedRect(12,12,40,40,6,6);return QIcon(px);}
          QIcon MainWindow::makeCubeIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);p.setPen(QPen(Qt::white,3));p.drawPolygon(QPolygon()<<QPoint(18,28)<<QPoint(46,28)<<QPoint(46,52)<<QPoint(18,52));p.drawPolygon(QPolygon()<<QPoint(18,28)<<QPoint(30,16)<<QPoint(58,16)<<QPoint(46,28));p.drawPolygon(QPolygon()<<QPoint(46,28)<<QPoint(58,16)<<QPoint(58,40)<<QPoint(46,52));return QIcon(px);}
          QIcon MainWindow::makeUndoIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);p.setPen(QPen(Qt::white,4,Qt::SolidLine,Qt::RoundCap,Qt::RoundJoin));p.drawArc(16,16,32,32,30*16,200*16);p.drawLine(16,28,10,20);p.drawLine(16,28,24,20);return QIcon(px);}
          QIcon MainWindow::makeRedoIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);p.setPen(QPen(Qt::white,4,Qt::SolidLine,Qt::RoundCap,Qt::RoundJoin));p.drawArc(16,16,32,32,150*16,-200*16);p.drawLine(48,28,54,20);p.drawLine(48,28,40,20);return QIcon(px);}
          QIcon MainWindow::makeMenuIcon(){QPixmap px(64,64);px.fill(Qt::transparent);QPainter p(&px);p.setRenderHint(QPainter::Antialiasing);p.setPen(QPen(Qt::white,4,Qt::SolidLine,Qt::RoundCap));p.drawLine(16,22,48,22);p.drawLine(16,32,48,32);p.drawLine(16,42,48,42);return QIcon(px);}
          void MainWindow::onMove(){m_gl->setTool(0);} void MainWindow::onRotate(){m_gl->setTool(1);} void MainWindow::onSelect(){m_gl->setTool(2);}
          void MainWindow::onAddCube(){m_gl->addCube();} void MainWindow::onUndo(){m_gl->undo();} void MainWindow::onRedo(){m_gl->redo();}
          void MainWindow::onMenu(){QMessageBox::information(this,"Menu","Nomad Animator (Qt 6)");}
          EOF

          cat > src/glwidget.h << 'EOF'
          #pragma once
          #include <QOpenGLWidget>
          #include <QOpenGLExtraFunctions>
          #include <QMatrix4x4>
          #include <QVector3D>
          #include <vector>
          class GLWidget : public QOpenGLWidget, protected QOpenGLExtraFunctions {
            Q_OBJECT
          public:
            explicit GLWidget(QWidget *parent=nullptr);
            void setTool(int t); void addCube(); void undo(); void redo();
          protected:
            void initializeGL() override; void resizeGL(int,int) override; void paintGL() override;
            void mousePressEvent(QMouseEvent*) override; void mouseMoveEvent(QMouseEvent*) override;
            void wheelEvent(QWheelEvent*) override;
          private:
            int m_tool=0; float m_yaw=0.6f,m_pitch=0.4f,m_dist=8.f;
            QVector3D m_target{0,0.5f,0}; QPoint m_last; bool m_drag=false;
            struct Cube{QVector3D pos,scale{1,1,1},color;};
            std::vector<Cube> m_cubes; std::vector<std::vector<Cube>> m_undo,m_redo;
            QMatrix4x4 view() const;
          };
          EOF

          cat > src/glwidget.cpp << 'EOF'
          #include "glwidget.h"
          #include <QMouseEvent>
          #include <QWheelEvent>
          #include <QtMath>
          #include <QPainter>
          GLWidget::GLWidget(QWidget *p):QOpenGLWidget(p){setMinimumSize(400,300);Cube c;c.pos={0,0.5f,0};c.color={0.9f,0.35f,0.3f};m_cubes.push_back(c);}
          void GLWidget::setTool(int t){m_tool=t;update();}
          void GLWidget::addCube(){m_undo.push_back(m_cubes);m_redo.clear();Cube c;c.pos={float(m_cubes.size()%4)*1.5f-2.f,0.5f,0};static QVector3D cols[]={{0.9f,0.35f,0.3f},{0.3f,0.7f,0.9f},{0.5f,0.85f,0.4f},{0.95f,0.8f,0.3f},{0.7f,0.45f,0.9f}};c.color=cols[m_cubes.size()%5];m_cubes.push_back(c);update();}
          void GLWidget::undo(){if(m_undo.empty())return;m_redo.push_back(m_cubes);m_cubes=m_undo.back();m_undo.pop_back();update();}
          void GLWidget::redo(){if(m_redo.empty())return;m_undo.push_back(m_cubes);m_cubes=m_redo.back();m_redo.pop_back();update();}
          void GLWidget::initializeGL(){initializeOpenGLFunctions();glClearColor(0.12f,0.12f,0.14f,1);glEnable(GL_DEPTH_TEST);}
          void GLWidget::resizeGL(int w,int h){glViewport(0,0,w,h);}
          QMatrix4x4 GLWidget::view() const {QMatrix4x4 m;float cy=qCos(m_yaw),sy=qSin(m_yaw),cp=qCos(m_pitch),sp=qSin(m_pitch);m.lookAt(m_target+QVector3D(cp*sy,sp,cp*cy)*m_dist,m_target,{0,1,0});return m;}
          void GLWidget::paintGL(){glClear(GL_COLOR_BUFFER_BIT|GL_DEPTH_BUFFER_BIT);QMatrix4x4 proj;proj.perspective(60.f,float(width())/qMax(1,height()),0.1f,100.f);QMatrix4x4 v=view();QPainter painter(this);painter.setRenderHint(QPainter::Antialiasing);
            auto pr=[&](QVector3D p){QVector4D c=(proj*v)*QVector4D(p,1);if(qAbs(c.w())<1e-6f)return QPointF(-999,-999);return QPointF((c.x()/c.w()*0.5f+0.5f)*width(),(1.f-(c.y()/c.w()*0.5f+0.5f))*height());};
            painter.setPen(QPen(QColor(60,60,70),1));for(int i=-10;i<=10;i++){painter.drawLine(pr({float(i),0,-10}),pr({float(i),0,10}));painter.drawLine(pr({-10,0,float(i)}),pr({10,0,float(i)}));}
            for(auto&c:m_cubes){QVector3D co[8]={c.pos+QVector3D(-.5f,-.5f,-.5f)*c.scale,c.pos+QVector3D(.5f,-.5f,-.5f)*c.scale,c.pos+QVector3D(.5f,.5f,-.5f)*c.scale,c.pos+QVector3D(-.5f,.5f,-.5f)*c.scale,c.pos+QVector3D(-.5f,-.5f,.5f)*c.scale,c.pos+QVector3D(.5f,-.5f,.5f)*c.scale,c.pos+QVector3D(.5f,.5f,.5f)*c.scale,c.pos+QVector3D(-.5f,.5f,.5f)*c.scale};QPointF pt[8];for(int i=0;i<8;i++)pt[i]=pr(co[i]);QColor col(c.color.x()*255,c.color.y()*255,c.color.z()*255);painter.setPen(QPen(col.darker(120),2));painter.setBrush(col);auto f=[&](int a,int b,int c,int d){QPolygonF poly;poly<<pt[a]<<pt[b]<<pt[c]<<pt[d];painter.drawPolygon(poly);};f(0,1,2,3);f(4,5,6,7);f(0,1,5,4);f(2,3,7,6);f(0,3,7,4);f(1,2,6,5);}
            QString tn[]={"Mover","Rotacionar","Selecionar"};painter.setPen(Qt::white);painter.drawText(20,height()-20,QString("Ferramenta: %1 | Cubos: %2").arg(tn[m_tool]).arg(m_cubes.size()));}
          void GLWidget::mousePressEvent(QMouseEvent *e){m_last=e->pos();m_drag=true;}
          void GLWidget::mouseMoveEvent(QMouseEvent *e){if(!m_drag)return;QPoint d=e->pos()-m_last;m_last=e->pos();if(e->buttons()&Qt::LeftButton){m_yaw-=d.x()*0.008f;m_pitch=qBound(-1.4f,m_pitch+d.y()*0.008f,1.4f);update();}else if(e->buttons()&Qt::RightButton){m_target.setX(m_target.x()-d.x()*0.01f);m_target.setY(m_target.y()+d.y()*0.01f);update();}}
          void GLWidget::wheelEvent(QWheelEvent *e){m_dist=qBound(1.f,m_dist-e->angleDelta().y()/120.f*0.8f,40.f);update();}
          EOF

          cat > android/AndroidManifest.xml << 'EOF'
          <?xml version="1.0"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:glEsVersion="0x00030000" android:required="true"/>
            <application android:label="Nomad Animator" android:extractNativeLibs="true">
              <activity android:name="org.qtproject.qt.android.bindings.QtActivity"
                android:exported="true" android:screenOrientation="landscape"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                android:configChanges="orientation|uiMode|screenLayout|screenSize|smallestScreenSize|layoutDirection|locale|fontScale|keyboard|keyboardHidden|navigation|mcc|mnc|density">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <meta-data android:name="android.app.lib_name" android:value="NomadAnimator"/>
              </activity>
            </application>
          </manifest>
          EOF

          # Força SDK 34 e suprime avisos
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          android.defaults.buildfeatures.buildconfig=true
          android.nonTransitiveRClass=false
          EOF
          echo "Project files created."

      - name: Build APK
        run: |
          set -e
          rm -f settings.gradle build.gradle
          rm -rf .gradle

          QT_HOST=$HOME/Qt/6.5.3/gcc_64
          QT_ANDROID=$HOME/Qt/6.5.3/android_arm64_v8a
          export PATH=$QT_HOST/bin:$PATH
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393
          export ANDROID_NDK=$ANDROID_NDK_ROOT

          mkdir -p build && cd build
          $QT_ANDROID/bin/qt-cmake \
            -DQT_HOST_PATH=$QT_HOST \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja \
            ..

          cmake --build . --parallel $(nproc)

          # Força plataforma 34 no androiddeployqt
          $QT_HOST/bin/androiddeployqt \
            --input android-NomadAnimator-deployment-settings.json \
            --output android-build \
            --android-platform android-34 \
            --jdk $JAVA_HOME \
            --gradle \
            --verbose || true

          echo "=== Procurando APK ==="
          find . -name "*.apk" -o -name "*.aab" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: nomad-animator-qt6-apk
          path: |
            build/**/*.apk
            build/**/*.aab
            build/android-build/**/*.apk
          if-no-files-found: warn
