      - name: Baixar bibliotecas (stb, cgltf)
        run: |
          set -e
          cd nomad-qt
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h -o stb_truetype.h || curl -fsSL https://cdn.jsdelivr.net/gh/nothings/stb@master/stb_truetype.h -o stb_truetype.h
          test -s stb_truetype.h
          curl -fsSL https://raw.githubusercontent.com/jkuhlmann/cgltf/master/cgltf.h -o cgltf.h || curl -fsSL https://cdn.jsdelivr.net/gh/jkuhlmann/cgltf@master/cgltf.h -o cgltf.h
          test -s cgltf.h
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h -o stb_image_write.h || curl -fsSL https://cdn.jsdelivr.net/gh/nothings/stb@master/stb_image_write.h -o stb_image_write.h
          test -s stb_image_write.h
          curl -fsSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o stb_image.h || curl -fsSL https://cdn.jsdelivr.net/gh/nothings/stb@master/stb_image.h -o stb_image.h
          test -s stb_image.h
          # Dear ImGui 1.92.5 + ImGuizmo (commit fixo, versao 1.92.5), via git
          rm -rf imgui /tmp/imgui-src /tmp/imguizmo-src
          mkdir -p imgui /tmp/imguizmo-src
          git clone -q --depth 1 --branch v1.92.5 https://github.com/ocornut/imgui.git /tmp/imgui-src
          for f in imgui.h imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp imgui_internal.h imconfig.h imstb_rectpack.h imstb_textedit.h imstb_truetype.h; do cp "/tmp/imgui-src/$f" imgui/; done
          (cd /tmp/imguizmo-src && git init -q && git remote add origin https://github.com/CedricGuillemet/ImGuizmo.git && git fetch -q --depth 1 origin 105e4fde45e4e74aae8973d98750820ef7aca7e2 && git checkout -q FETCH_HEAD)
          cp /tmp/imguizmo-src/src/ImGuizmo.h /tmp/imguizmo-src/src/ImGuizmo.cpp imgui/
          python3 - <<'PYEOF'
          p = "imgui/ImGuizmo.cpp"
          s = open(p).read()
          old = "float radiusAxis = sqrtf((ImLengthSqr(worldToPos(gContext.mModel.v.position, gContext.mViewProjection) - circlePos[0])));"
          new = "float radiusAxis = 0.f; { const ImVec2 c0_ = worldToPos(gContext.mModel.v.position, gContext.mViewProjection); for (int i_ = 0; i_ < circleMul * halfCircleSegmentCount + 1; i_++) { float d_ = sqrtf(ImLengthSqr(c0_ - circlePos[i_])); if (d_ > radiusAxis) radiusAxis = d_; } }"
          assert s.count(old) == 1, "patch do anel do ImGuizmo nao encontrou o trecho"
          open(p, "w").write(s.replace(old, new))
          print("ImGuizmo: circulo branco agora cobre os aneis")
          PYEOF
          ls -la imgui

      - name: Salvar arquivos no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nomad-qt
          git diff --cached --quiet || (git commit -m "Projeto Qt Quick gerado pelo build" && git push) || echo "Sem permissao para salvar (veja Settings > Actions > General > Workflow permissions)"

      - name: Dependencias do sistema
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y ninja-build libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 || true

      - name: Cache do Qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VERSION }}-desktop-android-arm64-v1

      - name: Instalar Qt (desktop + Android arm64)
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: |
          set -e
          pip install aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt"
          python3 -m aqt install-qt linux android "$QT_VERSION" android_arm64_v8a -O "$HOME/Qt"

      - name: Android SDK e NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"; fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager nao encontrado, baixando..."
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/ct
            unzip -q /tmp/ct.zip -d /tmp/ct
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Manifesto Android (paisagem, tela cheia, permissoes)
        run: |
          set -e
          QT_ANDROID="$HOME/Qt/$QT_VERSION/android_arm64_v8a"
          TPL="$(find "$QT_ANDROID" -path '*templates/AndroidManifest.xml' | head -n1)"
          test -n "$TPL" || { echo "Template do manifesto do Qt nao encontrado"; exit 1; }
          mkdir -p nomad-qt/android/res/values nomad-qt/android/res/values-v28
          cp "$TPL" nomad-qt/android/AndroidManifest.xml
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          A = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', A)
          p = 'nomad-qt/android/AndroidManifest.xml'
          tree = ET.parse(p, parser=ET.XMLParser(target=ET.TreeBuilder(insert_comments=True)))
          root = tree.getroot()
          q = lambda n: '{%s}%s' % (A, n)
          app = root.find('application')
          act = app.find('activity')
          assert app is not None and act is not None, 'manifesto sem application/activity'
          act.set(q('screenOrientation'), 'sensorLandscape')
          act.set(q('windowSoftInputMode'), 'adjustNothing')
          act.set(q('theme'), '@style/NomadTheme')
          app.set(q('theme'), '@style/NomadTheme')
          for el in (app, act):
              v = el.get(q('label'))
              if v and 'INSERT_APP_NAME' in v:
                  el.set(q('label'), 'Nomad Animator')
          have = {e.get(q('name')) for e in root.findall('uses-permission')}
          perm = 'android.permission.MANAGE_EXTERNAL_STORAGE'
          if perm not in have:
              e = ET.Element('uses-permission')
              e.set(q('name'), perm)
              root.insert(list(root).index(app), e)
          tree.write(p, encoding='utf-8', xml_declaration=True)
          print(open(p, encoding='utf-8').read())
          PYEOF
          cat > nomad-qt/android/res/values/styles.xml <<'XEOF'
          <resources>
            <style name="NomadTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen"/>
          </resources>
          XEOF
          cat > nomad-qt/android/res/values-v28/styles.xml <<'XEOF'
          <resources>
            <style name="NomadTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen">
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>
          </resources>
          XEOF
          grep -c 'sensorLandscape' nomad-qt/android/AndroidManifest.xml

      - name: Shaders Vulkan (Slang → SPIR-V)
        run: |
          set -e
          SLANG_V=2026.20
          mkdir -p "$RUNNER_TEMP/slang" "$RUNNER_TEMP/spv"
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_V}/slang-${SLANG_V}-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP/slang"
          SLANGC="$(find "$RUNNER_TEMP/slang" -name slangc -type f | head -1)"
          chmod +x "$SLANGC"
          "$SLANGC" nomad-qt/vk/mesh.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry fsDepth -stage fragment -O2 -o "$RUNNER_TEMP/spv/mesh.depthfrag.spv"
          "$SLANGC" nomad-qt/vk/ao.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry vsMain -stage vertex -O2 -o "$RUNNER_TEMP/spv/ao.vert.spv"
          "$SLANGC" nomad-qt/vk/ao.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry fsGtao -stage fragment -O2 -o "$RUNNER_TEMP/spv/ao.gtao.spv"
          "$SLANGC" nomad-qt/vk/ao.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry fsBlur -stage fragment -O2 -o "$RUNNER_TEMP/spv/ao.blur.spv"
          for n in mesh text gz; do
            "$SLANGC" "nomad-qt/vk/$n.slang" -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry vsMain -stage vertex -O2 -o "$RUNNER_TEMP/spv/$n.vert.spv"
            "$SLANGC" "nomad-qt/vk/$n.slang" -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry fsMain -stage fragment -O2 -o "$RUNNER_TEMP/spv/$n.frag.spv"
          done
          "$SLANGC" nomad-qt/vk/pt.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry csTrace -stage compute -O2 -o "$RUNNER_TEMP/spv/pt.trace.spv"
          "$SLANGC" nomad-qt/vk/pt.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry csResolve -stage compute -O2 -o "$RUNNER_TEMP/spv/pt.resolve.spv"
          "$SLANGC" nomad-qt/vk/pt.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry csDnPrep -stage compute -O2 -o "$RUNNER_TEMP/spv/pt.dnprep.spv"
          "$SLANGC" nomad-qt/vk/pt.slang -target spirv -profile spirv_1_3 -matrix-layout-column-major -entry csDnStep -stage compute -O2 -o "$RUNNER_TEMP/spv/pt.dnstep.spv"
          python3 - <<'PY'
          import glob, os, struct
          out = ["// gerado no build (Slang): SPIR-V dos shaders do viewport Vulkan", "#pragma once", "#include <cstddef>", "#include <cstdint>"]
          for p in sorted(glob.glob(os.environ["RUNNER_TEMP"] + "/spv/*.spv")):
              name = os.path.basename(p)[:-4].replace(".", "_")
              d = open(p, "rb").read()
              assert len(d) % 4 == 0
              w = struct.unpack("<%dI" % (len(d) // 4), d)
              out.append("static const uint32_t k_%s[] = {%s};" % (name, ",".join("0x%08x" % x for x in w)))
              out.append("static const size_t k_%s_size = %d;" % (name, len(d)))
          open("nomad-qt/vkshaders.h", "w").write("\n".join(out) + "\n")
          PY

      - name: Configurar (qt-cmake)
        run: |
          set -e
          QT_HOST="$HOME/Qt/$QT_VERSION/gcc_64"
          QT_ANDROID="$HOME/Qt/$QT_VERSION/android_arm64_v8a"
          "$QT_ANDROID/bin/qt-cmake" -S nomad-qt -B "$RUNNER_TEMP/nomad-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG="-O2 -g1" \
            -DCMAKE_C_FLAGS_DEBUG="-O2 -g1" \
            -DQT_HOST_PATH="$QT_HOST" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      - name: Compilar APK
        run: |
          set -e
          cmake --build "$RUNNER_TEMP/nomad-build" --target apk
          find "$RUNNER_TEMP/nomad-build" -name "*.apk" -print

      - uses: actions/upload-artifact@v4
        with:
          name: nomad-animator-qt-apk
          path: ${{ runner.temp }}/nomad-build/android-build/build/outputs/apk/**/*.apk
